[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "lipari-bank-ai"
version = "0.1.0"
description = "Bootcamp Python AI Powered v3 — Lipari Consulting"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "pgvector>=0.5.0",
    "openai>=3.3.0",
    "anthropic>=1.5.0",
    "instructor>=1.17.0",
    "tenacity>=9.1.4",
    "sentence-transformers>=6.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "ANN", "ASYNC", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
    "fastapi.Path", "fastapi.Body", "fastapi.Form",
    "fastapi.File", "fastapi.Cookie",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-m 'not eval'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: LLM evaluations (slow + cost; run with: uv run pytest -m eval)",
]
