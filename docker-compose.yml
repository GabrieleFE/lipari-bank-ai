services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lipari_ai_db
    environment:
      POSTGRES_USER: lipari
      POSTGRES_PASSWORD: lipari
      POSTGRES_DB: lipari_ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lipari -d lipari_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: